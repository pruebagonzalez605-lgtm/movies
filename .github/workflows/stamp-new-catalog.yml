name: Stamp new catalog items

on:
  push:
    branches: [main, master]
    paths:
      - "src/scripts/data/movies.js"
      - "src/scripts/data/series.js"

# Evita loop infinito: no correr si el commit ya es del bot
concurrency:
  group: stamp-catalog
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    # Solo si el autor NO es el bot de stamp
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: stamp addedAt')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect and stamp new titles
        id: stamp
        run: |
          node tools/stamp-new-catalog.js --base HEAD~1 --head HEAD
          if git diff --quiet -- src/scripts/data/movies.js src/scripts/data/series.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit stamped files
        if: steps.stamp.outputs.changed == 'true'
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/data/movies.js src/scripts/data/series.js
          git commit -m "chore: stamp addedAt on new catalog items"
          git push
